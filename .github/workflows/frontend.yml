name: frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: contract, quality, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # SC-008 / FR-021: fails when backend/openapi.json changes without
      # regenerating lib/api/schema.d.ts (also covered by tests/contract.test.ts).
      - name: Contract drift guard
        run: npm run check:contract

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests (Vitest + Testing Library + MSW)
        run: npm test

      - name: Production build
        run: npm run build
